name: Daily stock price dump

on:
  workflow_dispatch: ~
  schedule:
    - cron: "0 10 * * 0-4"

jobs:
  collect_dump:
    name: Collect daily dump for latest share price from DSEBD.ORG
    runs-on: ubuntu-22.04

    env:
      DT_TODY: ""

      BR_CODE: "master"
      BR_DUMP: "dump-files"

      FL_DUMP: ""
      PR_DUMP_BR: "new-files/dse-stock-price"
      COMMIT_MSG: "Add DSE stock price on date"

    steps:
      - name: Dynamically set DT_TODY environment variable
        run: |
          echo $(date +'%Y-%m-%d')
          echo "DT_TODY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Get the code from code branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BR_CODE }}
          token: ${{ secrets.CI_PAT }}
          path: ${{ env.BR_CODE }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python packages
        run: |
          cd $BR_CODE
          uv pip install --system -r pyproject.toml

      - name: Fetch and parse the page, then update the added_file path
        run: |
          cd $BR_CODE
          python -m parsers.daily_dse_stock_price
          echo "FL_DUMP=$(git ls-files --others --exclude-standard)" >> $GITHUB_ENV

      - name: Get the code from file dump branch
        uses: actions/checkout@v4
        if: ${{ endsWith(env.FL_DUMP, '.csv') }}
        with:
          ref: ${{ env.BR_DUMP }}
          token: ${{ secrets.CI_PAT }}
          path: ${{ env.BR_DUMP }}

      - name: Copy create dump to dump path
        if: ${{ endsWith(env.FL_DUMP, '.csv') }}
        run: |
          cp "$BR_CODE/$FL_DUMP" "$BR_DUMP/$(dirname $FL_DUMP)"
          cd ${{ env.BR_DUMP }}
          git status -u

      - name: Push file `${{ env.FL_DUMP }}`
        id: pushout
        uses: EndBug/add-and-commit@v9
        if: ${{ endsWith(env.FL_DUMP, '.csv') }}
        with:
          default_author: github_actions
          fetch: false
          message: ${{ env.COMMIT_MSG }} ${{ env.DT_TODY }}
          new_branch: ${{ env.PR_DUMP_BR }}-${{ env.DT_TODY }}
          cwd: "./${{env.BR_DUMP}}"

      - name: Create PR to `${{env.BR_DUMP}}`
        if: ${{ steps.pushout.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
        run: |
          cd ${{ env.BR_DUMP }}
          gh pr create -B ${{env.BR_DUMP}} -H "${{ env.PR_DUMP_BR }}-${{ env.DT_TODY }}" -f
